apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      containers:
      - name: audit-service
        image: mydockerhub/audit-service:latest
        ports:
        - containerPort: 5002
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        env:
        - name: VAULT_ADDR
          value: "http://vault:8200"
        - name: VAULT_TOKEN
          value: "root"
        - name: ES_HOST
          value: "http://elasticsearch:9200"
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
spec:
  type: ClusterIP
  selector:
    app: audit-service
  ports:
  - port: 5002
    targetPort: 5002
