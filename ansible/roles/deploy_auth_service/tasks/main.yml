---
- name: Create Kubernetes Namespace if not exists
  kubernetes.core.k8s:
    name: "{{ env }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Apply Auth Service Kubernetes Manifests
  kubernetes.core.k8s:
    state: present
    template: "{{ playbook_dir }}/k8s/auth-service.yml.j2"
