---
- name: Pull audit-service image
  docker_image:
    name: mydockerhub/audit-service
    tag: "{{ image_tag | default('latest') }}"
    source: pull

- name: Stop existing audit-service container
  docker_container:
    name: audit-service-{{ env }}
    state: absent

- name: Start audit-service container
  docker_container:
    name: audit-service-{{ env }}
    image: mydockerhub/audit-service:{{ image_tag | default('latest') }}
    state: started
    ports:
      - "5002:5002"
    env:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
      ES_HOST: "http://elasticsearch:9200"
    network_mode: devsecops-net
